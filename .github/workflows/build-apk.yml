name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Localizar el proyecto
        run: |
          set -e
          if [ -f gradlew ]; then
            PROJECT_DIR=.
          else
            ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n1)
            if [ -z "$ZIP" ]; then
              echo "No encuentro gradlew ni ningún archivo .zip en la raíz del repositorio."
              exit 1
            fi
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            G=$(find _src -name gradlew | head -n1)
            if [ -z "$G" ]; then
              echo "El zip no contiene gradlew."
              exit 1
            fi
            PROJECT_DIR=$(dirname "$G")
          fi
          echo "Proyecto en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Dar permiso de ejecución a gradlew
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Compilar APK de depuración
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteca3D-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
